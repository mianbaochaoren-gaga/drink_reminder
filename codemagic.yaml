# Codemagic 云端打包配置 - 喝水提醒 App
workflows:
  ios-release:
    name: iOS 打包（喝水提醒）
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: 15.4
      cocoapods: default
    scripts:
      - name: 安装 Flutter 依赖
        script: flutter pub get

      - name: 安装 iOS Pod 依赖
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 构建 Release IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
    caching:
      cache_pull_requests: true
      cache:
        - ~/.pub-cache
        - root: ./ios
          paths:
            - Pods/
