# Codemagic 云端打包配置 - 喝水提醒 App（未签名IPA，配合Sideloadly使用）
workflows:
  ios-release:
    name: iOS 未签名打包（配合Sideloadly）
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: 15.4
      cocoapods: default
    scripts:
      - name: 安装 Flutter 依赖
        script: flutter pub get

      - name: 安装 iOS Pod 依赖
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 构建未签名 iOS App
        script: flutter build ios --release --no-codesign

      - name: 手动打包成未签名 IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../drink_reminder.ipa Payload
          cd ../..
          ls -la build/drink_reminder.ipa

    artifacts:
      - build/drink_reminder.ipa
    caching:
      cache_pull_requests: true
      cache:
        - ~/.pub-cache
        - root: ./ios
          paths:
            - Pods/
